services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./logs:/logs
    environment:
      LOG_PATH: /logs/tool_calls.jsonl

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.example
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/backend
    depends_on:
      - backend
